name: PackWatch scraper

on:
  schedule:
    # Runs every 30 minutes. GitHub's scheduler is best-effort and can lag
    # a few minutes during high load — fine for preorder tracking.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          TCGPLAYER_API_KEY: ${{ secrets.TCGPLAYER_API_KEY }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
          TCGPLAYER_CAMPAIGN_ID: ${{ secrets.TCGPLAYER_CAMPAIGN_ID }}
          PACKWATCH_DB: packwatch.db
        run: python scraper.py

      - name: Export deals.json for the static-hosting path
        run: python export_json.py

      - name: Run notifier (send alerts for new preorders / price drops)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PACKWATCH_DB: packwatch.db
        run: python notifier.py

      - name: Commit updated data
        run: |
          git config user.name "packwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packwatch.db deals.json
          git diff --quiet --cached || git commit -m "chore: update scraped listings [skip ci]"
          git push
